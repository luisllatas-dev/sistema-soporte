apiVersion: apps/v1
kind: Deployment
metadata:
  name: solicitudes-service
  labels:
    app: solicitudes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solicitudes
  template:
    metadata:
      labels:
        app: solicitudes
    spec:
      containers:
        - name: solicitudes
          image: solicitudes-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: solicitudes-service
  labels:
    app: solicitudes
spec:
  type: LoadBalancer
  selector:
    app: solicitudes
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080